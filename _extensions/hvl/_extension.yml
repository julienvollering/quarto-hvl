title: HVL RevealJS
author: julienvollering
version: 1.3.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      # brand first = lowest priority; hvl-theme.scss overrides it.
      # Do not reverse these: putting brand last makes it win, which silently
      # replaces the theme's font stacks. See the palette note in hvl-theme.scss.
      theme: [brand, hvl-theme.scss]
      slide-number: c/t
      progress: true
      hash: true
      controls: false
      transition: slide
      transition-speed: slow
      highlight-style: github
      code-line-numbers: true

